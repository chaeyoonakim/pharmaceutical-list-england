name: Sync to Hugging Face Space

# Pushes main to the Streamlit Space at
# https://huggingface.co/spaces/chaeyoona/pharmaceutical-list-england
# One-time setup (see README "Deployment"): create the Space and add an
# HF_TOKEN repository secret (a Hugging Face write token).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_TOKEN is configured
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HF_TOKEN secret not set — skipping Space sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - name: Push to Space
        if: steps.token.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://chaeyoona:${HF_TOKEN}@huggingface.co/spaces/chaeyoona/pharmaceutical-list-england" \
            HEAD:main
