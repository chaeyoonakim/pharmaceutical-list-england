name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Paths are guarded so CI stays green while the project is built out
      # PR by PR (src/, data/, dashboard/, tests/ land in later PRs).
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          for d in src data dashboard; do
            if [ -d "$d" ]; then mypy "$d"; fi
          done

      - name: Test
        run: |
          if [ -d tests ]; then pytest; else echo "No tests yet"; fi
